name: KasetiOS
options:
  bundleIdPrefix: dev.emoona
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  KasetiOS:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Kaset
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Lets you pull spike-log.txt out through the Files app / Finder.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.emoona.kaset
        PRODUCT_NAME: KasetiOS
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  KasetiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/KasetiOSTests
    dependencies:
      - target: KasetiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.emoona.kaset.tests
